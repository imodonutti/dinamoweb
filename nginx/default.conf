server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # Anteprima: fuori dai motori di ricerca (da togliere al lancio su dinamoweb.com)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Password facoltativa (BASIC_AUTH_USER / BASIC_AUTH_PASSWORD in Coolify)
    include /etc/nginx/auth.inc;

    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # URL puliti: /chi_siamo serve chi_siamo.html
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
